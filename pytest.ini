[pytest]
# Where pytest looks for tests
testpaths =
    milestone1_pytest_basics/tests
    milestone2_ui_flows/tests

# Test file naming patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Define custom markers
markers =
    smoke: quick checks for critical paths
    regression: full suite of regression tests

# Default CLI options
addopts = -v --tb=short --maxfail=3